<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лови сердечки ❤️</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        overflow: hidden;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: Arial, sans-serif;
        height: 100vh;
        color: white;
    }

    #game {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
    }

    .top {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
    }

    h1 {
        font-size: 28px;
        text-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    #score {
        margin-top: 8px;
        font-size: 20px;
    }

    .heart {
        position: absolute;
        font-size: 42px;
        cursor: pointer;
        user-select: none;
        animation: fall linear;
        filter: drop-shadow(0 4px 5px rgba(0,0,0,.2));
    }

    @keyframes fall {
        from {
            transform: translateY(-70px) rotate(0deg);
        }

        to {
            transform: translateY(110vh) rotate(360deg);
        }
    }

    #message {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,.35);
        z-index: 20;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 25px;
    }

    .box {
        background: white;
        color: #ff5c7a;
        padding: 30px;
        border-radius: 25px;
        max-width: 350px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }

    .box h2 {
        font-size: 28px;
        margin-bottom: 12px;
    }

    .box p {
        color: #555;
        font-size: 17px;
        margin-bottom: 20px;
    }

    button {
        border: none;
        background: #ff5c7a;
        color: white;
        padding: 12px 25px;
        border-radius: 20px;
        font-size: 16px;
        cursor: pointer;
    }

    button:active {
        transform: scale(.95);
    }
</style>
</head>

<body>

<div id="game">

    <div class="top">
        <h1>Лови сердечки ❤️</h1>
        <div id="score">Счёт: 0</div>
    </div>

    <div id="message">
        <div class="box">
            <h2>Ты собрал(а) 20 ❤️</h2>
            <p>Похоже, у тебя действительно много любви 🥰</p>
            <button onclick="restart()">Играть ещё</button>
        </div>
    </div>

</div>

<script>

let score = 0;
let gameRunning = true;

const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

function createHeart() {

    if (!gameRunning) return;

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = ["❤️", "💗", "💖", "💕", "💘"];

    heart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

    const size = 30 + Math.random() * 25;

    heart.style.fontSize = size + "px";

    heart.style.left =
        Math.random() * (window.innerWidth - 60) + "px";

    const duration = 3 + Math.random() * 3;

    heart.style.animationDuration = duration + "s";

    game.appendChild(heart);

    heart.addEventListener("click", function () {

        score++;

        scoreText.textContent = "Счёт: " + score;

        heart.remove();

        if (score >= 20) {
            win();
        }

    });

    setTimeout(() => {
        if (heart.parentElement) {
            heart.remove();
        }
    }, duration * 1000);
}

function win() {

    gameRunning = false;

    document.querySelectorAll(".heart").forEach(h => h.remove());

    message.style.display = "flex";
}

function restart() {

    score = 0;

    scoreText.textContent = "Счёт: 0";

    message.style.display = "none";

    gameRunning = true;
}

setInterval(createHeart, 700);

</script>

</body>
</html>
